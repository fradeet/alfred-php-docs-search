name: template-cli
help: Example CLI for an Alfred workflow
version: 0.1.0

dependencies:
  - jq

flags:
  - long: --verbose
    short: -v
    help: Show diagnostic messages on stderr
    repeatable: true

commands:
  - name: hello
    help: Output a Hello result for Alfred
  - name: docs-index
    dependencies:
      - curl
    flags:
      - long: --language
        arg: language
        allowed: [en, zh, de, es, fr, it, ja, pt_BR, ru, tr, uk]
        default: en
      - long: --output-format
        arg: format
        allowed: [json, alfred]
        default: json
